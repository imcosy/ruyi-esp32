<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>如意 · 语音对话</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
    background: radial-gradient(120% 90% at 50% 0%, #1a2333 0%, #0c1017 55%, #07080d 100%);
  }

  /* ───────── 摄像头画面（全屏背景） ───────── */
  #cam {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; opacity: 0; transition: opacity .35s ease;
    transform: scaleX(-1);      /* 前置摄像头镜像，看得自然 */
    background: #000;
  }
  body.cam-on #cam { opacity: 1; }
  /* 上下渐变遮罩：保证顶部标题与底部按钮在任何画面上都清晰 */
  #veil {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease;
    background:
      linear-gradient(180deg, rgba(6,8,12,.72) 0%, rgba(6,8,12,.18) 20%, rgba(6,8,12,0) 45%,
                            rgba(6,8,12,.55) 82%, rgba(6,8,12,.86) 100%);
  }
  body.cam-on #veil { opacity: 1; }

  /* ───────── 顶部 ───────── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    background: radial-gradient(circle at 32% 28%, #6fc3ff, #2F80ED 58%, #1b5bbf);
    box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 6px 18px rgba(47,128,237,.45);
  }
  .logo.speaking { animation: avatarPulse 1.1s ease-in-out infinite; }
  @keyframes avatarPulse {
    0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 0 0 5px rgba(47,128,237,.16); }
    50%     { box-shadow: 0 0 0 1px rgba(255,255,255,.3), 0 0 0 14px rgba(47,128,237,.04); }
  }
  .name { font-size: 16.5px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .sub {
    display: flex; align-items: center; gap: 6px; margin-top: 2px;
    font-size: 11.5px; color: rgba(255,255,255,.62); text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .2s; }
  .dot.on { background: #4FBFA5; box-shadow: 0 0 8px rgba(79,191,165,.9); }
  .chip {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 6px 11px; border-radius: 999px;
    background: rgba(12,16,22,.42); border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: rgba(255,255,255,.72); transition: all .2s;
  }
  .chip svg { width: 14px; height: 14px; }
  .chip.on { color: #c9ffe9; border-color: rgba(79,191,165,.55); background: rgba(20,80,64,.45); }
  .chip.on svg { stroke: #4FBFA5; }

  /* ───────── 消息区 ───────── */
  #chat {
    position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 10;
    padding: calc(78px + env(safe-area-inset-top)) 16px calc(132px + env(safe-area-inset-bottom));
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 11px;
  }
  #chat::-webkit-scrollbar { width: 0; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.sys { justify-content: center; }
  .bub {
    max-width: 78%; padding: 11px 15px; border-radius: 18px;
    font-size: 15px; line-height: 1.58; word-break: break-word; white-space: pre-wrap;
    backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
    animation: bubbleIn .22s ease-out;
  }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .row.ai .bub {
    background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.14);
    border-bottom-left-radius: 5px; box-shadow: 0 6px 22px rgba(0,0,0,.22);
  }
  .row.user .bub {
    background: rgba(47,128,237,.80); border: 1px solid rgba(122,180,255,.5);
    border-bottom-right-radius: 5px; box-shadow: 0 6px 22px rgba(24,80,180,.35);
  }
  .row.sys .bub {
    background: rgba(12,16,22,.40); border: 1px solid rgba(255,255,255,.10);
    color: rgba(255,255,255,.62); font-size: 12.5px; padding: 6px 13px; border-radius: 999px;
  }
  .bub img { display: block; max-width: 100%; border-radius: 12px; margin-bottom: 7px; }
  .bub .cap { font-size: 12.5px; opacity: .8; }
  .caret {
    display: inline-block; width: 7px; height: 15px; margin-left: 3px; vertical-align: -2px;
    background: rgba(255,255,255,.85); animation: blink .9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ───────── 底部控制 ───────── */
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(116px + env(safe-area-inset-bottom));
    z-index: 20; text-align: center; font-size: 12.5px; pointer-events: none;
    color: rgba(255,255,255,.72); text-shadow: 0 1px 8px rgba(0,0,0,.7);
    transition: opacity .2s;
  }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 34px;
    padding: 0 20px calc(24px + env(safe-area-inset-bottom));
  }
  .side {
    width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
    background: rgba(16,20,28,.42); color: #fff; cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s, background .2s, border-color .2s;
  }
  .side svg { width: 23px; height: 23px; stroke: rgba(255,255,255,.9); fill: none;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side:active { transform: scale(.92); }
  .side.active {
    background: rgba(79,191,165,.32); border-color: rgba(79,191,165,.75);
    box-shadow: 0 0 18px rgba(79,191,165,.35);
  }
  .side.active svg { stroke: #b9ffe6; }

  #mic {
    position: relative; width: 78px; height: 78px; border-radius: 50%; border: none;
    cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(150deg, #4a9bff, #2F80ED 55%, #1a5fd0);
    box-shadow: 0 10px 30px rgba(47,128,237,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .16s, background .3s, box-shadow .3s;
  }
  #mic svg { width: 31px; height: 31px; fill: none; stroke: #fff; stroke-width: 2;
             stroke-linecap: round; stroke-linejoin: round; }
  #mic svg .cap-fill { fill: #fff; stroke: none; }
  #mic:active { transform: scale(.94); }
  #mic.live {
    background: linear-gradient(150deg, #55e0a8, #22b47c 55%, #128f5f);
    box-shadow: 0 10px 30px rgba(34,180,124,.45), inset 0 1px 0 rgba(255,255,255,.3);
  }
  #mic.think {
    background: linear-gradient(150deg, #8f7bff, #6b52e0 55%, #4b33b8);
    box-shadow: 0 10px 30px rgba(107,82,224,.45), inset 0 1px 0 rgba(255,255,255,.3);
  }
  #mic.speak {
    background: linear-gradient(150deg, #ff9ec4, #ef5d97 55%, #c23a72);
    box-shadow: 0 10px 30px rgba(239,93,151,.45), inset 0 1px 0 rgba(255,255,255,.3);
  }
  #mic .halo {
    position: absolute; inset: -6px; border-radius: 50%; pointer-events: none;
    border: 1px solid rgba(255,255,255,.35); opacity: 0; transition: opacity .2s;
  }
  #mic.live .halo { opacity: 1; animation: halo 1.8s ease-out infinite; }
  @keyframes halo {
    0%   { transform: scale(.96); opacity: .75; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  #status {
    position: fixed; left: 50%; top: calc(74px + env(safe-area-inset-top)); z-index: 40;
    transform: translateX(-50%);
    background: rgba(10,14,20,.80); border: 1px solid rgba(255,255,255,.12);
    color: #fff; font-size: 12.5px; padding: 8px 16px; border-radius: 999px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: none; max-width: 86vw; text-align: center;
  }

  @media (min-width: 760px) {
    #chat { padding-left: max(16px, calc(50% - 340px)); padding-right: max(16px, calc(50% - 340px)); }
    header { padding-left: max(18px, calc(50% - 360px)); padding-right: max(18px, calc(50% - 360px)); }
  }
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<div id="veil"></div>

<header>
  <div class="brand">
    <div class="logo" id="avatar">如</div>
    <div>
      <div class="name">如意</div>
      <div class="sub"><span class="dot" id="connDot"></span><span id="connText">待命</span></div>
    </div>
  </div>
  <div class="chip" id="camChip">
    <svg viewBox="0 0 24 24"><path d="M15 8.5V6.8A1.8 1.8 0 0 0 13.2 5H4.8A1.8 1.8 0 0 0 3 6.8v10.4A1.8 1.8 0 0 0 4.8 19h8.4a1.8 1.8 0 0 0 1.8-1.8v-1.7l4.3 2.6a.8.8 0 0 0 1.2-.7V6.6a.8.8 0 0 0-1.2-.7L15 8.5Z"/></svg>
    <span id="camText">摄像头关闭</span>
  </div>
</header>

<main id="chat"></main>
<div id="hint">点击话筒，和如意说话</div>

<footer>
  <button class="side" id="btnPhoto" aria-label="发送照片">
    <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.6" cy="10" r="1.6"/><path d="m4.5 17 4.2-4.2a1.8 1.8 0 0 1 2.5 0l3.1 3.1m1.4-1.4 1.6-1.6a1.8 1.8 0 0 1 2.5 0l2.2 2.2"/></svg>
  </button>
  <button id="mic" aria-label="开始对话">
    <span class="halo"></span>
    <svg viewBox="0 0 24 24"><rect class="cap-fill" x="9" y="2.2" width="6" height="11.2" rx="3"/><path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0"/><path d="M12 18v3.6"/></svg>
  </button>
  <button class="side" id="btnCam" aria-label="开关摄像头">
    <svg viewBox="0 0 24 24"><path d="M15 8.5V6.8A1.8 1.8 0 0 0 13.2 5H4.8A1.8 1.8 0 0 0 3 6.8v10.4A1.8 1.8 0 0 0 4.8 19h8.4a1.8 1.8 0 0 0 1.8-1.8v-1.7l4.3 2.6a.8.8 0 0 0 1.2-.7V6.6a.8.8 0 0 0-1.2-.7L15 8.5Z"/></svg>
  </button>
</footer>

<input type="file" id="file" accept="image/*" hidden>
<div id="status"></div>

<script>
/* ==========================================================================
 * 如意语音对话 Demo
 * --------------------------------------------------------------------------
 * 协议与 sisi_esp 固件一致，仅两处浏览器化：
 *   上行：整段音频放 JSON 帧 {audio:<base64 PCM16 16k>}（固件是 binary opus_raw）
 *   下行：opus_raw 裸流 → WebCodecs AudioDecoder 解码 → AudioContext 播放
 *
 * 连续对话：点话筒开始后本地能量 VAD 自动切句（静音 600ms 提交一句），
 *          摄像头开启时每句话自动抓一帧画面（448px/JPEG q0.6）随该句一起送 AI。
 * ========================================================================== */
const $ = s => document.querySelector(s);
const chat = $('#chat');

const CFG = {
  silenceMs: 600,      // 静音判定（项目统一规则）
  minVoiceMs: 400,     // 过短语音丢弃
  energy: 0.012,       // 能量门限（16k int16 RMS）
  preRoll: 6,          // 前置缓冲帧数（6×32ms≈192ms，保住句首）
  snapWidth: 448,      // 抓帧宽度（视觉塔内部归一化，448 足够且省上行）
  snapQuality: 0.6,
};

const S = {
  ws: null, open: false,
  live: false,          // 连续对话开启
  aiBusy: false,        // AI 正在思考/说话（半双工，期间不听）
  cam: { on: false, stream: null },
  echoSkip: false,      // 本地已加用户气泡时，跳过服务端回显的 asr_result
  rec: { ctx: null, stream: null, node: null, chunks: [], pre: [], voiceRun: 0, silentMs: 0, capturing: false, samples: 0 },
  dec: null, playCtx: null, gain: null, nextAt: 0, playSrcs: [], ttsDone: false,
  ai: { bub: null, text: '', final: true, useChunk: false },
};

/* ───────── 基础 UI ───────── */
function toast(msg, ms = 3200) {
  const el = $('#status');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, ms);
}
function scrollBottom() { chat.scrollTop = chat.scrollHeight; }
function addSys(text) {
  const row = document.createElement('div');
  row.className = 'row sys';
  const b = document.createElement('div');
  b.className = 'bub';
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  scrollBottom();
}
function addUser(text, thumb) {
  const row = document.createElement('div');
  row.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bub';
  if (thumb) {
    const img = document.createElement('img');
    img.src = thumb;
    b.appendChild(img);
  }
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.textContent = text;
  b.appendChild(cap);
  row.appendChild(b);
  chat.appendChild(row);
  scrollBottom();
  return b;
}
function newAiBubble() {
  const row = document.createElement('div');
  row.className = 'row ai';
  const b = document.createElement('div');
  b.className = 'bub';
  row.appendChild(b);
  chat.appendChild(row);
  S.ai.bub = b;
  S.ai.text = '';
  S.ai.final = false;
  scrollBottom();
}
function aiAppend(text) {
  if (!S.ai.bub || S.ai.final) newAiBubble();
  S.ai.text += text;
  S.ai.bub.textContent = S.ai.text;
  scrollBottom();
}
function aiFinish() {
  if (S.ai.bub && !S.ai.final) {
    S.ai.bub.textContent = S.ai.text;
    S.ai.final = true;
  }
}

/* ───────── 状态显示 ───────── */
function setHint(t) { $('#hint').textContent = t; }
function micState(cls) {
  const m = $('#mic');
  m.classList.remove('live', 'think', 'speak');
  if (cls) m.classList.add(cls);
  $('#avatar').classList.toggle('speaking', cls === 'speak');
}
function setConn(on) {
  $('#connDot').classList.toggle('on', on);
  $('#connText').textContent = on ? '已连接' : '待命';
}

/* ───────── WebSocket ─────────
 * 一轮一次请求：音频（+图片）放在同一个 JSON 帧里。
 * 云端协议约束：连接的第一轮只认「首帧自带 audio」或 binary，所以
 *   · 连接未建立 → 新开连接，把本轮作为首帧发出去
 *   · 连接已建立 → 直接发本轮 JSON 帧（第 N 轮）
 * 连接空闲 120s 由服务端关闭，下一轮自动重新建连，无需心跳。 */
const BASE_FIRST = {
  format: 'pcm',                 // 上行 PCM int16 16k（固件为 opus_raw）
  sample_rate: 16000,
  language: 'zh',
  output_format: 'opus',         // 下行 opus_raw 裸流
  stream_text: true,
  client_type: 'web_demo',
  board: 'browser',
};

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  return proto + location.host + '/s2s/ws';
}
function bindSocket(ws) {
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) { onAudio(ev.data); return; }
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    onMessage(m);
  };
  ws.onclose = () => {
    if (ws !== S.ws) return;
    const wasOpen = S.open;
    S.ws = null; S.open = false;
    setConn(false);
    if (!wasOpen) {                 // 连不上：本轮作废，回到待机
      toast('连接服务端失败，请稍后再试');
      S.aiBusy = false;
      idle();
    } else if (S.live) {
      setHint('连接已断开，下一句会自动重连');
    }
  };
  ws.onerror = () => {};
}
/** 发送一轮：首轮合进首帧，后续轮直接发 JSON 帧 */
function sendTurn(frame) {
  if (S.ws && S.ws.readyState === 1) {
    S.ws.send(JSON.stringify(frame));
    return;
  }
  if (S.ws && S.ws.readyState === 0) {   // 正在建连：本轮直接发出去（第 2 轮）
    S.ws.send(JSON.stringify(frame));
    return;
  }
  const ws = new WebSocket(wsUrl());
  S.ws = ws;
  bindSocket(ws);
  ws.onopen = () => {
    if (ws !== S.ws) return;
    S.open = true;
    setConn(true);
    ws.send(JSON.stringify(Object.assign({
      api_key: localStorage.getItem('demo_api_key') || '',
    }, BASE_FIRST, frame)));
  };
}

/* ───────── 服务端消息 ───────── */
function onMessage(m) {
  switch (m.type) {
    case 'device_config':
      break;
    case 'asr_result':
      if (S.echoSkip) { S.echoSkip = false; break; }   // 本地已加气泡（发照片轮），跳过回显
      if (m.text) addUser(m.text, null);
      break;
    case 'llm_start':
      S.ai.useChunk = true;
      newAiBubble();
      break;
    case 'llm_chunk':
      S.ai.useChunk = true;
      aiAppend(m.text || '');
      break;
    case 'tts_sentence':
      if (!S.ai.useChunk) aiAppend(m.text || '');
      break;
    case 'tts_start':
      initPlayer();
      setHint('如意说话中…');
      micState(S.live ? 'speak' : null);
      break;
    case 'tts_done':
      S.ttsDone = true;
      maybeIdle();
      break;
    case 'done':
      aiFinish();
      S.ttsDone = true;
      S.echoSkip = false;
      maybeIdle();
      break;
    case 'aborted':
      aiFinish();
      stopPlayback();
      idle();
      break;
    case 'error':
      addSys('出错了：' + (m.message || '').slice(0, 140));
      S.echoSkip = false;
      aiFinish();
      stopPlayback();
      idle();
      break;
    case 'closed':
      try { S.ws.close(); } catch (e) {}
      break;
  }
}

function idle() {
  S.aiBusy = false;
  S.ai.final = true;
  micState(S.live ? 'live' : null);
  setHint(S.live ? '聆听中…再点一次话筒结束' : '点击话筒，和如意说话');
}
function maybeIdle() {
  if (!S.aiBusy) return;
  // 文本结束 + 下行音频播完 → 回到聆听
  if (S.ttsDone && S.playSrcs.length === 0) {
    setTimeout(() => { if (S.ttsDone && S.playSrcs.length === 0) idle(); }, 180);
  }
}

/* ───────── 下行音频：opus_raw → WebCodecs → 定序播放 ───────── */
/** 同步建好解码器：tts_start 与首个音频块之间没有等待，异步初始化会丢首帧 */
function initPlayer() {
  if (!('AudioDecoder' in window)) return;   // 老浏览器：只显示文字，不播放语音
  if (S.dec) {
    if (S.playCtx.state === 'suspended') S.playCtx.resume();
    return;
  }
  S.playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
  if (S.playCtx.state === 'suspended') S.playCtx.resume();
  S.gain = S.playCtx.createGain();
  S.gain.connect(S.playCtx.destination);
  S.nextAt = S.playCtx.currentTime;
  S.dec = new AudioDecoder({
    output: ad => {
      const n = ad.numberOfFrames, sr = ad.sampleRate;
      const f32 = new Float32Array(n);
      ad.copyTo(f32, { planeIndex: 0, format: 'f32' });
      ad.close();
      if (!S.playCtx) return;
      const buf = S.playCtx.createBuffer(1, n, sr);
      buf.copyToChannel(f32, 0);
      const src = S.playCtx.createBufferSource();
      src.buffer = buf;
      src.connect(S.gain);
      const start = Math.max(S.nextAt, S.playCtx.currentTime + 0.06);
      src.start(start);
      S.nextAt = start + buf.duration;
      S.playSrcs.push(src);
      src.onended = () => {
        S.playSrcs = S.playSrcs.filter(s => s !== src);
        maybeIdle();
      };
    },
    error: e => console.warn('[decoder]', e),
  });
  S.dec.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 1 });
}
function onAudio(buf) {
  if (!S.dec || S.dec.state !== 'configured') return;
  const dv = new DataView(buf);
  let pos = 0, ts = 0;
  while (pos + 2 <= buf.byteLength) {
    const flen = dv.getUint16(pos, true);
    if (buf.byteLength - pos - 2 < flen) break;
    if (flen > 0) {
      const frame = new Uint8Array(buf, pos + 2, flen);
      ts += 20000;                              // opus 帧 20ms，仅作排序时间戳
      try {
        S.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: ts, data: frame }));
      } catch (e) { console.warn('[decode]', e); }
    }
    pos += 2 + flen;
  }
}
function stopPlayback() {
  S.ttsDone = false;
  S.playSrcs.forEach(s => { try { s.stop(); } catch (e) {} });
  S.playSrcs = [];
  if (S.playCtx) S.nextAt = S.playCtx.currentTime;
}

/* ───────── 上行录音（AudioWorklet 16k int16 + 能量 VAD） ───────── */
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(512); this.n = 0; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = ch[i] < -1 ? -1 : (ch[i] > 1 ? 1 : ch[i]);
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === 512) { this.port.postMessage(this.buf.slice(0)); this.n = 0; }
    }
    return true;
  }
}
registerProcessor('cap', Cap);`;

async function startLive() {
  if (S.live) return;
  unlockAudio();                       // 手势内建好播放上下文（iOS 必须）
  try {
    S.rec.stream = await navigator.mediaDevices.getUserMedia(
      { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    toast('麦克风不可用：' + e.message);
    return;
  }
  S.rec.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  if (S.rec.ctx.state === 'suspended') await S.rec.ctx.resume();
  await S.rec.ctx.audioWorklet.addModule(
    URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  const src = S.rec.ctx.createMediaStreamSource(S.rec.stream);
  const node = new AudioWorkletNode(S.rec.ctx, 'cap');
  node.port.onmessage = e => onChunk(new Int16Array(e.data));
  src.connect(node);

  S.rec.node = node;
  S.rec.chunks = []; S.rec.pre = []; S.rec.voiceRun = 0;
  S.rec.silentMs = 0; S.rec.capturing = false; S.rec.samples = 0;
  S.live = true;
  micState('live');
  setHint(S.cam.on ? '聆听中…画面会随每句话一起送给如意' : '聆听中…再点一次话筒结束');
}

function stopLive() {
  S.live = false;
  if (S.rec.node) { S.rec.node.port.onmessage = null; try { S.rec.node.disconnect(); } catch (e) {} S.rec.node = null; }
  if (S.rec.stream) { S.rec.stream.getTracks().forEach(t => t.stop()); S.rec.stream = null; }
  if (S.rec.ctx) { S.rec.ctx.close(); S.rec.ctx = null; }
  S.rec.chunks = []; S.rec.pre = []; S.rec.capturing = false; S.rec.samples = 0;
  stopPlayback();
  S.aiBusy = false;
  micState(null);
  setHint('点击话筒，和如意说话');
  if (S.ai.bub && !S.ai.final) aiFinish();
}

function onChunk(i16) {
  if (!S.live) return;
  if (S.aiBusy) {                       // AI 说话期间不听（半双工，避免回采自问自答）
    S.rec.chunks = []; S.rec.pre = []; S.rec.capturing = false;
    S.rec.voiceRun = 0; S.rec.silentMs = 0; S.rec.samples = 0;
    return;
  }
  let sum = 0;
  for (let i = 0; i < i16.length; i++) sum += i16[i] * i16[i];
  const rms = Math.sqrt(sum / i16.length) / 32768;

  if (rms > CFG.energy) {
    S.rec.voiceRun++;
    if (!S.rec.capturing) {
      if (S.rec.voiceRun < 2) { pushPre(i16); return; }
      S.rec.capturing = true;             // 连续 2 帧有声 → 开始一句
      S.rec.chunks = S.rec.pre.slice();
      S.rec.pre = [];
      S.rec.samples = S.rec.chunks.reduce((n, c) => n + c.length, 0);
    }
    S.rec.chunks.push(i16);
    S.rec.samples += i16.length;
    S.rec.silentMs = 0;
  } else {
    S.rec.voiceRun = 0;
    if (S.rec.capturing) {
      S.rec.chunks.push(i16);
      S.rec.silentMs += 32;               // 512 样本 @16k = 32ms
      if (S.rec.silentMs >= CFG.silenceMs) submitUtterance();
    } else {
      pushPre(i16);
    }
  }
}
function pushPre(i16) {
  S.rec.pre.push(i16);
  if (S.rec.pre.length > CFG.preRoll) S.rec.pre.shift();
}

/** 一句话说完：整段 PCM（+摄像头画面）作为一轮发送 */
function submitUtterance() {
  const chunks = S.rec.chunks;
  S.rec.chunks = []; S.rec.pre = []; S.rec.capturing = false;
  S.rec.silentMs = 0; S.rec.voiceRun = 0;
  const samples = S.rec.samples;
  S.rec.samples = 0;
  if (!chunks.length || samples * 1000 / 16000 < CFG.minVoiceMs) return;

  const pcm = new Int16Array(samples);
  let off = 0;
  for (const c of chunks) { pcm.set(c, off); off += c.length; }

  const frame = { audio: b64of(pcm) };
  if (S.cam.on) {
    const img = snapshot();
    if (img) frame.image = img;
  }
  S.aiBusy = true;
  S.ttsDone = false;
  micState('think');
  setHint('如意思考中…');
  sendTurn(frame);
}

function b64of(i16) {
  const u8 = new Uint8Array(i16.buffer, i16.byteOffset, i16.byteLength);
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + 0x8000, u8.length)));
  }
  return btoa(s);
}

/* ───────── 摄像头 ───────── */
async function toggleCam() {
  unlockAudio();
  if (S.cam.on) { stopCam(); return; }
  try {
    S.cam.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 720 } }, audio: false,
    });
  } catch (e) {
    toast('无法访问摄像头：' + e.message);
    return;
  }
  $('#cam').srcObject = S.cam.stream;
  document.body.classList.add('cam-on');
  $('#btnCam').classList.add('active');
  $('#camChip').classList.add('on');
  $('#camText').textContent = '摄像头已开';
  S.cam.on = true;
  if (S.live) setHint('聆听中…画面会随每句话一起送给如意');
}
function stopCam() {
  S.cam.on = false;
  if (S.cam.stream) { S.cam.stream.getTracks().forEach(t => t.stop()); S.cam.stream = null; }
  $('#cam').srcObject = null;
  document.body.classList.remove('cam-on');
  $('#btnCam').classList.remove('active');
  $('#camChip').classList.remove('on');
  $('#camText').textContent = '摄像头关闭';
  if (S.live) setHint('聆听中…再点一次话筒结束');
}

/** 抓当前画面并压缩成 JPEG base64（失败返回空串） */
function snapshot() {
  const v = $('#cam');
  if (!v.videoWidth) return '';
  const w = CFG.snapWidth;
  const h = Math.max(1, Math.round(v.videoHeight * w / v.videoWidth));
  const c = snapshot.canvas || (snapshot.canvas = document.createElement('canvas'));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(v, 0, 0, w, h);
  return c.toDataURL('image/jpeg', CFG.snapQuality).split(',')[1] || '';
}

/* ───────── 发送照片 ───────── */
function sendPhoto(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const max = 1024;
    let w = img.width, h = img.height;
    if (Math.max(w, h) > max) {
      const k = max / Math.max(w, h);
      w = Math.round(w * k); h = Math.round(h * k);
    }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const b64 = c.toDataURL('image/jpeg', 0.82).split(',')[1];
    if (!b64) { toast('图片读取失败'); return; }
    addUser('发了一张照片，让如意看看', c.toDataURL('image/jpeg', 0.6));
    S.echoSkip = true;
    S.aiBusy = true;
    S.ttsDone = false;
    micState('think');
    setHint('如意识图中…');
    sendTurn({ noaudio: true, text: '我想让你看看这张照片', image: b64 });
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('图片读取失败'); };
  img.src = url;
}

/* ───────── 音频解锁（iOS/微信必须在用户手势内） ───────── */
function unlockAudio() {
  try {
    if (!S.playCtx || S.playCtx.state === 'closed') {
      S.playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    }
    if (S.playCtx.state === 'suspended') S.playCtx.resume();
  } catch (e) {}
}

/* ───────── 事件绑定 ───────── */
$('#mic').addEventListener('click', () => { unlockAudio(); S.live ? stopLive() : startLive(); });
$('#btnCam').addEventListener('click', toggleCam);
$('#btnPhoto').addEventListener('click', () => { unlockAudio(); $('#file').click(); });
$('#file').addEventListener('change', function () {
  if (this.files && this.files[0]) sendPhoto(this.files[0]);
  this.value = '';
});

/* ───────── 启动 ───────── */
if (!('AudioDecoder' in window)) {
  addSys('当前浏览器不支持 WebCodecs 音频解码，请用 Chrome / Edge / Safari 16.4+ 打开');
}
addSys('点话筒开始，说完一句自动发送；开摄像头后每句话都会带上当前画面');
setHint('点击话筒，和如意说话');
</script>
</body>
